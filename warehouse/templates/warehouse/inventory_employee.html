{% if can_chon_nv %}
  <label class="inventory-field">
    Nhân viên thực hiện*

    <select class="inp" name="ma_nv" required>
      <option value="">Chọn nhân viên</option>

      {% for n in ds_nv %}
        <option value="{{ n.ma_nv }}">
          {{ n.ma_nv }} - {{ n.ten_nv }}
        </option>
      {% endfor %}
    </select>
  </label>
{% endif %}
