{% extends "base.html" %}{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/operations.css' %}">{% endblock %}
{% block content %}{% if messages %}{% for m in messages %}<div class="alert{% if m.tags == 'error' %} alert--error{% endif %}">{{ m }}</div>{% endfor %}{% endif %}<div class="card"><form method="post" class="stack">{% csrf_token %}<div class="grid"><div class="field"><label>Mã phiếu (có thể để trống)</label><input class="input" name="ma_phieu" placeholder="Hệ thống tự sinh nếu để trống"></div><div class="field"><label>Ngày nhập kho</label><input class="input" type="date" name="ngay_nhap" required></div><div class="field"><label>Xe / VIN từ chứng từ nhập</label><select class="select" name="chi_tiet_nhap_id" required><option value="">Chọn xe</option>{% for line in xe_co_the_nhap %}<option value="{{ line.pk }}">{{ line.xe_id }} — {{ line.xe.ten_xe }} — {{ line.hoa_don_nhap.nha_cung_cap.ten_ncc }}</option>{% endfor %}</select></div><div class="field"><label>Kho nhập</label><select class="select" name="kho_id" required><option value="">Chọn kho</option>{% for item in kho %}<option value="{{ item.pk }}">{{ item.chi_nhanh.ten_cn }}</option>{% endfor %}</select></div></div><div><button class="btn btn--primary" type="submit"><i class="bi bi-save"></i>Lưu phiếu nháp</button> <a class="btn btn--light" href="{% url 'warehouse:nhap' %}">Hủy</a></div></form></div>{% endblock %}
