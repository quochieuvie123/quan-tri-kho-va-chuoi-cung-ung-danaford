<header class="topbar">
  <div class="topbar__search">
    <i class="bi bi-search"></i>
    <input type="search" placeholder="Tìm kiếm, tìm đến chức năng...">
  </div>

  <label class="topbar__branch">
    <i class="bi bi-geo-alt"></i>
    <select>
      <option>Cả ba kho</option>
      <option>Đà Nẵng</option>
      <option>Bình Định</option>
      <option>Gia Lai</option>
    </select>
  </label>

  <div class="topbar__right">
    <button class="icon-btn" type="button" aria-label="Thông báo"><i class="bi bi-bell"></i></button>

    <details class="user-menu">
      <summary>
        <span class="avatar">{{ user_display.initials }}</span>
        <span class="user-meta">
          <strong>{{ user_display.name }}</strong>
          <small>{{ user_display.role }}</small>
        </span>
        <i class="bi bi-chevron-down"></i>
      </summary>
      <div class="user-menu__panel">
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">Trang quản trị</a>{% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Đăng xuất</button>
        </form>
      </div>
    </details>
  </div>
</header>
