{% load static %}
<aside class="sidebar">
  <a href="{% url 'dashboard:home' %}" class="sidebar__logo">
    <img src="{% static 'img/logo-dana-ford.jpg' %}" alt="Dana Ford">
  </a>
  <nav class="sidebar__nav">
    {% for item in menu_items %}
      <a href="{{ item.url }}" class="nav-item{% if item.active %} is-active{% endif %}">
        <i class="bi {{ item.icon }}"></i>
        <span>{{ item.label }}</span>
      </a>
    {% endfor %}
  </nav>
</aside>
